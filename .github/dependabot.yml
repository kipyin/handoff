# Dependabot — keep streamlit, sqlmodel, etc. up to date.
# One grouped weekly PR covers all pip dependencies (production and dev).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns:
          - "*"
